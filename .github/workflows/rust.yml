name: Rust

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Check workspace
        run: cargo check --workspace --all-features

  test:
    name: Test (${{ matrix.configuration }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: default
            features: ""
          - configuration: serde
            features: "--features serde"
          - configuration: instrument
            features: "--features instrument"
          - configuration: all
            features: "--all-features"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run --workspace ${{ matrix.features }}
      - name: Run doctests
        run: cargo test --workspace --doc ${{ matrix.features }}
      - name: Test workspace README
        if: matrix.configuration == 'default'
        run: python3 scripts/check-workspace-readme.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy check
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  compatibility:
    name: Published API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks
      - name: Compare with published releases
        run: |
          cargo semver-checks -p mti --baseline-version 1.1.1 --all-features
          cargo semver-checks -p typeid_prefix --baseline-version 1.2.1 --all-features
          cargo semver-checks -p typeid_suffix --baseline-version 1.3.0 --all-features

  package:
    name: Verify published packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Package and verify each crate
        run: |
          cargo package -p typeid_prefix --all-features
          cargo package -p typeid_suffix --all-features
          cargo package -p mti --all-features
